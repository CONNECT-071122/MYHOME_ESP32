<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giám sát & Điều khiển 8 Relay</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; margin: 0; padding: 20px; }
    h2 { color: #333; }
    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; max-width: 600px; margin: 0 auto 20px auto; }
    .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn { display: inline-block; padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; color: white; text-decoration: none; transition: 0.2s; width: 100%; box-sizing: border-box; }
    .btn-on { background-color: #28a745; }
    .btn-off { background-color: #dc3545; }
    .btn-ota { background-color: #007bff; max-width: 300px; padding: 12px; margin-top: 10px; }
    .btn:active { transform: scale(0.95); }
    p { font-weight: bold; margin-bottom: 10px; color: #555; }
    .status { font-size: 12px; color: #777; margin-top: 5px; }
  </style>
</head>
<body>
  <h2>GIÁM SÁT & ĐIỀU KHIỂN 8 RELAY</h2>
  <div class="grid-container" id="relay-grid"></div>
  
  <div class="card" style="max-width: 330px; margin: 0 auto;">
    <p>Cập nhật phần mềm hệ thống</p>
    <button class="btn btn-ota" onclick="triggerOTA()">CẬP NHẬT OTA (ONLINE)</button>
    <div id="ota-status" class="status" style="margin-top: 8px;">Trạng thái: Sẵn sàng</div>
  </div>

  <script>
    function updateRelays() {
      fetch('/status').then(response => response.json()).then(data => {
        let grid = document.getElementById('relay-grid');
        grid.innerHTML = '';
        for (let i = 0; i < 8; i++) {
          let isOn = data.relays[i];
          let btnClass = isOn ? 'btn btn-off' : 'btn btn-on';
          let btnText = isOn ? 'TẮT (OFF)' : 'BẬT (ON)';
          let card = `<div class="card">
                        <p>Relay ${i + 1}</p>
                        <button class="${btnClass}" onclick="toggleRelay(${i})">${btnText}</button>
                        <div class="status">Trạng thái: ${isOn ? 'Đang Bật' : 'Đang Tắt'}</div>
                      </div>`;
          grid.innerHTML += card;
        }
      }).catch(err => console.log("Lỗi kết nối thiết bị"));
    }

    function toggleRelay(num) {
      fetch(`/toggle?id=${num}`).then(() => updateRelays());
    }

    function triggerOTA() {
      if(confirm("Bạn có chắc chắn muốn tiến hành cập nhật OTA không?")) {
        document.getElementById('ota-status').innerText = "Trạng thái: Đang tiến hành cập nhật...";
        fetch('/ota').then(res => res.text()).then(msg => {
          alert(msg);
        });
      }
    }

    setInterval(updateRelays, 1000);
    window.onload = updateRelays;
  </script>
</body>
</html>
