<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điều Khiển Giám Sát Hệ Thống Điện Gia Đình</title>
    <!-- Thư viện MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h2 {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
            text-transform: uppercase;
        }

        /* Bảng thông số 2 hàng x 4 cột */
        .monitor-table {
            border-collapse: collapse;
            width: 100%;
            max-width: 900px;
            border: 2px solid #000000;
            margin-bottom: 40px;
        }

        .monitor-table td {
            border: 1px solid #000000;
            padding: 8px 12px;
            font-size: 14px;
            width: 25%;
            vertical-align: top;
            background-color: #ffffff;
        }

        .val {
            font-weight: bold;
            color: #0056b3;
            margin-left: 5px;
        }

        /* Hàng 4 nút bấm điều khiển */
        .button-group {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            width: 100%;
            max-width: 900px;
        }

        .btn {
            flex: 1;
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            padding: 10px 0;
            font-size: 15px;
            font-weight: normal;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000000;
            transition: all 0.1s ease;
        }

        .btn:active {
            box-shadow: 0px 0px 0px #000000;
            transform: translate(2px, 2px);
        }

        .btn.active {
            background-color: #e0e0e0;
            font-weight: bold;
        }

        /* Trạng thái kết nối */
        #status-info {
            margin-top: 15px;
            font-size: 12px;
            color: #666666;
        }
    </style>
</head>
<body>

    <h2>ĐIỀU KHIỂN GIÁM SÁT HỆ THỐNG ĐIỆN GIA ĐÌNH</h2>

    <!-- Bảng hiển thị thông số điện năng -->
    <table class="monitor-table">
        <tr>
            <td>Voltage: <span id="val-voltage" class="val">-- V</span></td>
            <td>Current: <span id="val-current" class="val">-- A</span></td>
            <td>Power Factor: <span id="val-pf" class="val">--</span></td>
            <td>Active Power: <span id="val-apower" class="val">-- W</span></td>
        </tr>
        <tr>
            <td>Reactive Power: <span id="val-rpower" class="val">-- var</span></td>
            <td>Apparent Power: <span id="val-spower" class="val">-- VA</span></td>
            <td>Frequency: <span id="val-freq" class="val">-- Hz</span></td>
            <td>Temperature: <span id="val-temp" class="val">-- °C</span></td>
        </tr>
    </table>

    <!-- Hàng nút nhấn điều khiển -->
    <div class="button-group">
        <button class="btn" onclick="sendControl('BTN1')">Nút ấn 1</button>
        <button class="btn" onclick="sendControl('BTN2')">Nút ấn 2</button>
        <button class="btn" onclick="sendControl('BTN3')">Nút ấn 3</button>
        <button class="btn" onclick="sendControl('BTN4')">Nút ấn 4</button>
    </div>

    <div id="status-info">Trạng thái kết nối: Đang kết nối MQTT Server...</div>

    <script>
        // Cấu hình MQTT Broker
        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

        const topicControl = "esp32/myhome/control";
        const topicStatus  = "esp32/myhome/status";

        client.on('connect', () => {
            document.getElementById('status-info').innerText = "Trạng thái kết nối: Đã kết nối MQTT Broker!";
            client.subscribe(topicStatus);
        });

        client.on('message', (topic, message) => {
            if (topic === topicStatus) {
                try {
                    // Xử lý dữ liệu định dạng JSON gửi từ ESP32
                    const data = JSON.parse(message.toString());
                    if (data.voltage !== undefined) document.getElementById('val-voltage').innerText = data.voltage + " V";
                    if (data.current !== undefined) document.getElementById('val-current').innerText = data.current + " A";
                    if (data.pf !== undefined) document.getElementById('val-pf').innerText = data.pf;
                    if (data.apower !== undefined) document.getElementById('val-apower').innerText = data.apower + " W";
                    if (data.rpower !== undefined) document.getElementById('val-rpower').innerText = data.rpower + " var";
                    if (data.spower !== undefined) document.getElementById('val-spower').innerText = data.spower + " VA";
                    if (data.freq !== undefined) document.getElementById('val-freq').innerText = data.freq + " Hz";
                    if (data.temp !== undefined) document.getElementById('val-temp').innerText = data.temp + " °C";
                } catch (e) {
                    // Nếu dữ liệu gửi về dạng văn bản thô
                    console.log("Dữ liệu thô từ ESP32:", message.toString());
                }
            }
        });

        // Hàm gửi lệnh điều khiển khi bấm nút
        function sendControl(cmd) {
            client.publish(topicControl, cmd);
            console.log("Đã gửi lệnh:", cmd);
        }
    </script>
</body>
</html>
