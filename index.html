<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dieu Khien LED RGB ESP32</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #2b2b3d;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 340px;
        }
        h2 { margin-bottom: 20px; color: #00d2ff; }
        .status-box {
            background: #181825;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #a6adc8;
            word-break: break-all;
        }
        .btn {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }
        .btn-red { background-color: #e64553; }
        .btn-green { background-color: #40a02b; }
        .btn-blue { background-color: #1e66f5; }
        .btn-off { background-color: #6c7086; }
        .btn:hover { opacity: 0.85; }
    </style>
</head>
<body>

    <div class="card">
        <h2>ESP32 RGB Dashboard</h2>
        
        <div class="status-box">
            <strong>Giam sat he thong:</strong>
            <p id="monitoring-data">Dang ket noi server...</p>
        </div>

        <button class="btn btn-red" onclick="sendControl('RED')">BAT MAU DO</button>
        <button class="btn btn-green" onclick="sendControl('GREEN')">BAT MAU XANH LA</button>
        <button class="btn btn-blue" onclick="sendControl('BLUE')">BAT MAU XANH DUONG</button>
        <button class="btn btn-off" onclick="sendControl('OFF')">TAT DEN</button>
    </div>

    <script>
        const client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');

        const topicControl = "esp32/myhome/control";
        const topicStatus  = "esp32/myhome/status";

        client.on('connect', () => {
            document.getElementById('monitoring-data').innerText = "Da ket noi MQTT Broker!";
            client.subscribe(topicStatus);
        });

        client.on('message', (topic, message) => {
            if (topic === topicStatus) {
                document.getElementById('monitoring-data').innerText = message.toString();
            }
        });

        function sendControl(cmd) {
            client.publish(topicControl, cmd);
        }
    </script>
</body>
</html>
